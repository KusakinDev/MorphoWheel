name: Feature or format request
description: Suggest a new conversion, tool or action
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see
      placeholder: "Convert .mkv subtitles tracks to .srt"
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Command or library that can do it
      description: Optional, but it makes the request much easier to implement.
      placeholder: ffmpeg -i in.mkv -map 0:s:0 out.srt
